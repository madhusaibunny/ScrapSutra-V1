services:
  - type: web
    name: scrapsutra-v1
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120

    envVars:
      - key: FLASK_DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: 3.11.11

      - key: GEMINI_API_KEY
        sync: false

      - key: UPLOADCARE_PUBLIC_KEY
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: scrapsutra-db
          property: connectionString

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: FIREBASE_API_KEY
        sync: false

      - key: FIREBASE_AUTH_DOMAIN
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: FIREBASE_STORAGE_BUCKET
        sync: false

      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false

      - key: FIREBASE_APP_ID
        sync: false

databases:
  - name: scrapsutra-db
    plan: free